version: "3.9"

services:
  backend:
    container_name: student-registry-backend
    build:
      context: ./student-registry-backend
      dockerfile: Dockerfile

    image: student-registry-backend:latest

    restart: unless-stopped

    env_file:
      - ./student-registry-backend/.env

    ports:
      - "3000:3000"

    networks:
      - student-network

  frontend:
    container_name: student-registry-frontend
    build:
      context: ./student-registry-frontend
      dockerfile: Dockerfile

    image: student-registry-frontend:latest

    depends_on:
      - backend

    restart: unless-stopped

    ports:
      - "5000:80"

    networks:
      - student-network

networks:
  student-network:
    driver: bridge